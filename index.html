<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo-Issue Reporter</title>
    <link rel="stylesheet" href="/css/styles.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>
<body>
    <nav class="navbar">
        <div class="brand">Geo-Issue Reporter</div>
        <div id="nav-links">
            <!-- Populated by JS -->
        </div>
    </nav>

    <div class="container" id="app">
        <!-- Views will be injected here -->
        <div id="loading">Loading...</div>
    </div>

    <!-- Templates -->
    <template id="login-template">
        <div class="card" style="max-width: 400px; margin: 2rem auto;">
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            <p>Don't have an account? <a href="#" onclick="router.navigate('register')">Register</a></p>
        </div>
    </template>

    <template id="register-template">
        <div class="card" style="max-width: 400px; margin: 2rem auto;">
            <h2>Register</h2>
            <form id="register-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="fullName" required>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                 <div class="form-group">
                    <label>Role</label>
                    <select name="role">
                        <option value="citizen">Citizen</option>
                        <option value="staff">Staff</option> 
                         <!-- Simplified for demo -->
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
            <p>Already have an account? <a href="#" onclick="router.navigate('login')">Login</a></p>
        </div>
    </template>

    <!-- Scripts -->
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="/js/app.js"></script>
</body>
</html>
