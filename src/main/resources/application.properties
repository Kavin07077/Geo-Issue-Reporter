spring.application.name=geo-issue-reporting
server.port=8081

# Database Configuration
# MySQL Configuration
# spring.datasource.url=jdbc:mysql://localhost:3306/geo_issue_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 Configuration
spring.datasource.url=jdbc:h2:mem:geo_issue_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=./uploads

# JWT Configuration
app.jwt.secret=9a4f2c8d3b7e1f6a5c0b4d2e8f1a9c6b3d7e5f8a2c1b4d0e6f9a2c5b8d1e4f7
app.jwt.expiration-ms=86400000

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.geo.issue=DEBUG
